syntax = "proto3";

package olvid.daemon.admin.v1;

import "olvid/daemon/datatypes/v1/client_key.proto";

option go_package = "olvid.io/daemon";
option java_multiple_files = true;
option java_package = "io.olvid.desktop.daemon.protobuf";

/*
 ** ClientKeyList
 ** List all client keys of this daemon (admin and non admin).
 ** This does not return temporary client keys passed in environment or as command line arguments.
 **
 ** **Error codes**:
 ** `PERMISSION_DENIED`: an admin client key is necessary.
 ** `INVALID_ARGUMENT`: filter is invalid.
 ** `INTERNAL`
 ** `UNAUTHENTICATED`: client key is invalid.
 */
message ClientKeyListRequest {
  optional datatypes.v1.ClientKeyFilter filter = 1;
}
message ClientKeyListResponse {
  repeated datatypes.v1.ClientKey client_keys = 1;
}

/*
 ** ClientKeyGet
 ** Get a specific client key details, identified by it's value.
 ** This does not return temporary client keys passed in environment or as command line arguments.
 **
 ** **Error codes**:
 ** `PERMISSION_DENIED`: an admin client key is necessary.
 ** `NOT_FOUND`: client key not found.
 ** `UNAUTHENTICATED`: client key is invalid.
 */
message ClientKeyGetRequest {
  string client_key = 1;
}
message ClientKeyGetResponse {
  datatypes.v1.ClientKey client_key = 1;
}

/*
 ** ClientKeyNew
 ** Create a new client key associated with a given identity.
 ** Pass 0 as identity id to create and admin client key.
 **
 ** **Error codes**:
 ** `PERMISSION_DENIED`: an admin client key is necessary.
 ** `NOT_FOUND`: identity not found.
 ** `INTERNAL`
 ** `UNAUTHENTICATED`: client key is invalid.
 */
message ClientKeyNewRequest {
  string name = 1;
  uint64 identity_id = 2;
}
message ClientKeyNewResponse {
  datatypes.v1.ClientKey client_key = 1;
}

/*
 ** ClientKeyDelete
 ** Delete a specific client key, identified by it's value.
 **
 ** **Error codes**:
 ** `PERMISSION_DENIED`: an admin client key is necessary.
 ** `NOT_FOUND`: client key not found.
 ** `UNAUTHENTICATED`: client key is invalid.
 */
message ClientKeyDeleteRequest {
  string client_key = 1;
}
message ClientKeyDeleteResponse {}
